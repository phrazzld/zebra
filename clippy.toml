# ZebraSign Clippy Configuration
#
# This file defines specific clippy settings for the ZebraSign project.
# The standard clippy command for this project is:
#   cargo clippy --all-targets --all-features --workspace -- -D warnings
#
# IMPORTANT: Lint suppressions are strongly discouraged per our Development Philosophy.
# Any allowances must be thoroughly justified and documented.

# List of allowed lints with justification
# ----------------------------------------
# clippy::impl_hash_borrow_with_str_and_bytes:
#   Allowed in boringascii/src/lib.rs because the BoringAscii type needs to be
#   usable in hash-based collections while also supporting borrowing as both
#   &str and &[u8] for API convenience. This is safe because BoringAscii's
#   constructor ensures that only valid ASCII is stored, making the &str and &[u8]
#   views semantically equivalent for hashing purposes. The type is
#   carefully constructed to ensure this invariant is maintained.

# No disallowed_methods or disallowed_types specified currently

# No type complexity thresholds modified from defaults

# No clippy::needless_pass_by_value exceptions
